<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="google" content="notranslate">
  <meta name="description" content="Minimal dark monthly performance calendar with animated expansion.">
  <title>Monthly Performance — Nov 2026</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --panel: #080808;
      --cell: #101010;
      --cell-border: #202020;
      --text: #f2f2f2;
      --muted: #929292;
      --yellow: #f4ed16;
      --red: #ee695d;
      --silver: #d7d7d7;
      --line: #414141;
      --ease: cubic-bezier(.2,.75,.25,1);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px 18px; background: #050505;
      color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .card {
      width: min(100%, 984px); padding: 24px 25px 26px;
      border: 1px solid rgba(220,220,205,.72); border-radius: 23px;
      background: linear-gradient(145deg, rgba(13,13,13,.98), rgba(3,3,3,.99));
      box-shadow: 0 0 0 1px rgba(255,255,255,.045), 0 22px 80px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.035);
      transition: padding .55s var(--ease);
    }
    .surface {
      border-radius: 16px; padding: 12px 14px 14px;
      background: linear-gradient(145deg, #0c0c0c, #080808);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.035);
    }
    .topline { position:relative; display:flex; align-items:center; gap:18px; min-height:44px; }
    .month { margin:0; font-size: clamp(23px, 3vw, 34px); line-height:1.1; font-weight:650; letter-spacing:-.045em; }
    .spacer { flex:1; }
    .total {
      display:inline-flex; align-items:center; justify-content:center; min-width:104px;
      padding:8px 14px; border-radius:12px; color:#f4f4f4; font-size:23px; font-weight:600;
      letter-spacing:-.035em; background:linear-gradient(180deg,#303030,#242424);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 2px 12px rgba(0,0,0,.35);
    }
    .toggle {
      position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; border-radius:10px;
      color:#dedede; background:transparent; cursor:pointer; transition:background .2s ease, transform .55s var(--ease);
      order:2;
    }
    .toggle:hover { background:#1a1a1a; }
    .toggle:focus-visible { outline:2px solid var(--yellow); outline-offset:3px; }
    .toggle svg { width:22px; height:22px; transition:transform .5s var(--ease); }
    .card[aria-expanded="true"] .toggle svg { transform:rotate(180deg); }
    .total { order:3; }
    .progress .track:first-child { flex:0 0 32%; }
    .progress .track:first-child .fill { width:100%; }
    .progress .track:nth-of-type(2) { flex:1; }
    .month { cursor:pointer; }
    .progress {
      display:flex; align-items:center; gap:10px; margin:24px 0 0;
      min-height:12px;
    }
    .track {
      height:5px; flex:1; min-width:0; overflow:hidden; border-radius:10px; background:var(--line);
      box-shadow:inset 0 1px 2px rgba(0,0,0,.7);
    }
    .fill { width:100%; height:100%; border-radius:inherit; background:var(--yellow); box-shadow:0 0 7px rgba(244,237,22,.18); }
    .amount { color:var(--yellow); font-size:17px; line-height:1; font-weight:550; white-space:nowrap; letter-spacing:-.025em; }
    .amount.end { margin-left:0; }
    .compact {
      display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:4px;
      margin-top:28px; overflow:hidden; max-height:110px; opacity:1; transform:translateY(0);
      transition:max-height .55s var(--ease), opacity .32s ease, margin .55s var(--ease), transform .55s var(--ease);
    }
    .day-mini { min-width:0; text-align:center; padding:2px 0 0; transition:opacity .25s ease; }
    .day-mini .date { display:block; color:#d8d8d8; font-size:14px; line-height:1.15; white-space:nowrap; font-variant-numeric:tabular-nums; touch-action:none; -webkit-touch-callout:none; }
    .day-mini .value { display:block; margin-top:7px; font-size:clamp(11px,1.45vw,15px); line-height:1.15; font-weight:600; white-space:nowrap; letter-spacing:-.045em; font-variant-numeric:tabular-nums; }
    .positive { color:var(--yellow); }
    .negative { color:var(--red); }
    .neutral { color:#c6bfa4; }
    .future { opacity:.38; }
    
    .calendar-wrap {
      display:grid; grid-template-rows:0fr; opacity:0; transform:translateY(-8px);
      transition:grid-template-rows .62s var(--ease), opacity .35s ease, transform .55s var(--ease), margin .55s var(--ease);
      margin-top:0;
    }
    .calendar-clip { min-height:0; overflow:hidden; }
    .calendar-inner { padding-top:28px; }
    .weekdays, .calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; }
    .range-status { min-height:18px; margin:0 0 10px; color:var(--yellow); font-size:12px; letter-spacing:.02em; text-align:center; }
    .weekdays { margin-bottom:10px; }
    .weekday { text-align:center; color:#c6c6c6; font-size:15px; font-weight:550; padding:0 0 6px; }
    .calendar-grid { grid-auto-rows:minmax(88px,1fr); }
    .day-cell {
      min-width:0; position:relative; display:flex; flex-direction:column; justify-content:space-between;
      padding:10px 12px 13px; border-radius:15px; border:1px solid var(--cell-border);
      background:linear-gradient(145deg,#121212,#0d0d0d);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.025), 0 2px 5px rgba(0,0,0,.2);
      transition:background .25s ease, border-color .25s ease, opacity .25s ease, transform .25s ease;
    }
    .day-cell .num { color:#e7e7e7; font-size:16px; line-height:1; touch-action:none; -webkit-touch-callout:none; }
    .day-cell .value { align-self:center; margin:auto 0 0; padding-top:10px; font-size:18px; line-height:1; font-weight:550; letter-spacing:-.035em; white-space:nowrap; }
    .day-cell.outside { opacity:.48; }
    .day-cell.future { opacity:.36; }
    .day-cell.today { border-color:rgba(244,237,22,.55); background:linear-gradient(145deg,#17170e,#10100b); box-shadow:inset 0 0 0 1px rgba(244,237,22,.08); }
    .day-cell.today .num { color:#fff; }
    .day-cell { cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:pan-y; }
    .day-cell.range-start, .day-cell.range-end {
      border-color:var(--yellow); background:var(--yellow); color:#080808;
      box-shadow:0 0 0 1px rgba(244,237,22,.18), 0 3px 14px rgba(244,237,22,.12);
      opacity:1;
    }
    .day-cell.range-start .num, .day-cell.range-end .num { color:#080808; font-weight:750; }
    .day-cell.range-start .value, .day-cell.range-end .value { color:#080808 !important; }
    .day-cell.in-range {
      border-color:rgba(244,237,22,.32); background:rgba(244,237,22,.13);
      border-radius:8px; opacity:1;
    }
    .day-cell.in-range .num { color:#fff; }
    .day-cell.long-pressing { transform:scale(.97); border-color:var(--yellow); }
    .editor-panel{margin-top:14px;padding:14px;border:1px solid #393939;border-radius:14px;background:#111}
    .editor-panel[hidden]{display:none}.editor-title{display:flex;justify-content:space-between;margin-bottom:12px;font-weight:650}
    .editor-panel label{display:block;color:#aaa;font-size:12px;margin-bottom:7px}
    .editor-panel input{width:100%;padding:12px;border:1px solid #444;border-radius:9px;background:#080808;color:#fff;font:inherit;font-size:18px}
    .editor-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
    .editor-actions button{padding:10px 14px;border:1px solid #555;border-radius:9px;background:#222;color:#fff}
    .editor-actions .save{border-color:var(--yellow);background:var(--yellow);color:#080808;font-weight:700}

    .card.edit-mode .month::after { content:"  • SELECT DATES"; color:var(--yellow); font-size:11px; letter-spacing:.08em; vertical-align:middle; }
    .card.edit-mode .day-cell { cursor:crosshair; }
    .card[aria-expanded="true"] .compact { max-height:0; opacity:0; margin-top:0; transform:translateY(-8px); pointer-events:none; }
    .card[aria-expanded="true"] .calendar-wrap { grid-template-rows:1fr; opacity:1; transform:translateY(0); margin-top:0; }
    .card[aria-expanded="true"] .calendar-inner { animation:calendar-in .65s var(--ease) both; }
    @keyframes calendar-in { from { opacity:.35; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @media (max-width:700px) {
      body { padding:18px 10px; align-items:center; }
      .card { padding:14px; border-radius:18px; }
      .surface { padding:10px 9px 12px; }
      .month { font-size:25px; white-space:nowrap; }
      .total { min-width:82px; padding:7px 10px; font-size:19px; }
      .toggle { width:34px; height:38px; }
      .progress { margin-top:20px; gap:7px; }
      .progress .track:first-child { flex-basis:20%; }
      .amount { font-size:12px; }
      .compact { gap:2px; margin-top:24px; }
      .day-mini .date { font-size:clamp(8px,1.7vw,12px); }
      .day-mini .value { font-size:clamp(9px,1.8vw,12px); margin-top:6px; }
      .calendar-inner { padding-top:22px; }
      .weekdays,.calendar-grid { gap:5px; }
      .weekday { font-size:11px; }
      .calendar-grid { grid-auto-rows:minmax(65px,1fr); }
      .day-cell { padding:8px 6px 9px; border-radius:10px; }
      .day-cell .num { font-size:13px; }
      .day-cell .value { font-size:13px; }
    }
    @media (max-width:390px) {
      .month { font-size:22px; }
      .total { min-width:73px; font-size:17px; }
      .day-mini .date { font-size:9px; }
      .day-mini .value { font-size:9px; }
      .day-cell .value { font-size:11px; }
      .calendar-grid { grid-auto-rows:minmax(58px,1fr); }
    }

    .finance-panel{width:min(100%,984px);margin:18px auto 0;padding:20px 22px;border:1px solid rgba(220,220,205,.55);border-radius:20px;background:linear-gradient(145deg,#101010,#070707);box-shadow:0 16px 48px rgba(0,0,0,.3)}
    .finance-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .finance-balance-label{color:#999;font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
    .finance-balance{font-size:clamp(25px,5vw,36px);font-weight:750;letter-spacing:-.045em;color:#f4ed16;font-variant-numeric:tabular-nums}
    .finance-breakdown{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;color:#aaa;font-size:12px}
    .finance-breakdown strong{color:#eee;font-variant-numeric:tabular-nums}
    .finance-actions{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;margin-top:18px}
    .finance-actions input,.finance-date{min-width:0;padding:11px 12px;border:1px solid #383838;border-radius:10px;background:#151515;color:#f2f2f2;font:inherit}
    .finance-actions button,.backup-actions button{padding:11px 15px;border:1px solid #454545;border-radius:10px;background:#1a1a1a;color:#eee;font:inherit;font-weight:650;cursor:pointer}
    .finance-actions .deposit-action{border-color:#a9a300;background:#f4ed16;color:#080808}
    .finance-actions .withdraw-action{border-color:#713a36;color:#ff8b80}
    .finance-date-wrap{display:flex;gap:8px;margin-top:9px;align-items:center;color:#999;font-size:12px}
    .finance-date{padding:7px 9px;font-size:13px}
    .history-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px;font-size:18px;font-weight:700}
    .history-totals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    .history-total{padding:11px 12px;border-radius:11px;background:#151515;color:#aaa;font-size:12px}
    .history-total strong{display:block;margin-top:4px;font-size:17px;color:#62d58c;font-variant-numeric:tabular-nums}
    .history-total.withdraw strong{color:#ff8278}
    .finance-history{display:grid;gap:7px}
    .finance-history-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 11px;border:1px solid #252525;border-radius:12px;background:#101010}
    .finance-history-icon{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#173323;color:#68dc91;font-size:20px;font-weight:700}
    .finance-history-row.withdraw .finance-history-icon{background:#351d1b;color:#ff8b80}
    .finance-history-date{display:block;color:#999;font-size:11px}
    .finance-history-type{display:block;margin-top:3px;color:#eee;font-size:13px;font-weight:650}
    .finance-history-amount{font-size:15px;font-weight:750;color:#68dc91;white-space:nowrap;font-variant-numeric:tabular-nums}
    .finance-history-row.withdraw .finance-history-amount{color:#ff8b80}
    .finance-empty{padding:18px 10px;text-align:center;color:#777;font-size:13px}
    .backup-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid #292929}
    .backup-actions button{font-size:12px}
    .backup-status{min-height:16px;margin-top:8px;color:#999;font-size:11px}
    @media(max-width:520px){.finance-panel{margin-top:12px;padding:15px 13px;border-radius:16px}.finance-actions{grid-template-columns:1fr 1fr}.finance-actions input{grid-column:1/-1}.finance-actions button{padding:10px 8px}.finance-history-row{grid-template-columns:30px minmax(0,1fr) auto;gap:8px}.finance-history-amount{font-size:13px}}

    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.01ms!important; transition-duration:.01ms!important; }
    }
  </style>
</head>
<body translate="no">
  <main class="card" id="performanceCard" aria-expanded="false">
    <section class="surface" aria-label="Monthly performance calendar">
      <header class="topline">
        <h1 class="month" id="monthToggle">Nov 2026</h1>
        <span class="spacer"></span>
        <button class="toggle" id="calendarToggle" type="button" aria-label="Open full November calendar" aria-controls="calendarPanel" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 14 7-7 7 7" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="total" id="calendar-total" aria-label="Total">$500</div>
      </header>

      <div class="progress" aria-label="Progress: 1400 of 2000">
        <div class="track"><div class="fill"></div></div>
        <span class="amount">$1400</span>
        <div class="track"><div class="fill" style="width:0"></div></div>
        <span class="amount end">$2000</span>
      </div>

      <section class="compact" id="compactDays" aria-label="Last ten days of November"></section>

      <section class="calendar-wrap" id="calendarPanel" aria-label="Full monthly calendar" inert>
        <div class="calendar-clip">
          <div class="calendar-inner">
            <div class="range-status" id="rangeStatus" aria-live="polite">Hold a date to enter edit mode, then tap the first and last dates</div>
            <div class="weekdays" aria-hidden="true">
              <span class="weekday">Mon</span><span class="weekday">Tue</span><span class="weekday">Wed</span>
              <span class="weekday">Thu</span><span class="weekday">Fri</span><span class="weekday">Sat</span><span class="weekday">Sun</span>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
            <section class="editor-panel" id="calendarEditor" hidden>
              <div class="editor-title"><span>Изменить сумму</span><span id="editorRangeLabel"></span></div>
              <label for="editorAmount">Сумма для выбранного диапазона</label>
              <input id="editorAmount" type="number" inputmode="decimal" step="0.01" placeholder="0">
              <div class="editor-actions"><button type="button" id="editorCancel">Отмена</button><button type="button" class="save" id="editorSave">Сохранить сумму</button></div>
            </section>
          </div>
        </div>
      </section>
    </section>

    <section class="finance-panel" aria-label="Депозит и история операций">
      <div class="finance-top">
        <div><div class="finance-balance-label">Текущий депозит</div><div class="finance-balance" id="finance-balance">$500.00</div></div>
        <div class="finance-breakdown"><span>Старт: <strong id="finance-base">$500.00</strong></span><span>Результат календаря: <strong id="finance-calendar-total">$0.00</strong></span></div>
      </div>
      <div class="finance-actions">
        <input id="finance-amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Сумма операции" aria-label="Сумма операции">
        <button class="deposit-action" id="finance-deposit" type="button">＋ Пополнить</button>
        <button class="withdraw-action" id="finance-withdraw" type="button">− Вывести</button>
      </div>
      <div class="finance-date-wrap">Дата операции <input class="finance-date" id="finance-date" type="date"></div>
      <div class="history-heading"><span>История пополнений и выводов</span></div>
      <div class="history-totals">
        <div class="history-total">Всего пополнено<strong id="finance-deposits">$0.00</strong></div>
        <div class="history-total withdraw">Всего выведено<strong id="finance-withdrawals">$0.00</strong></div>
      </div>
      <div class="finance-history" id="finance-history"></div>
      <div class="backup-actions">
        <button id="finance-export" type="button">Экспорт данных</button>
        <button id="finance-import" type="button">Импорт данных</button>
        <input id="finance-file" type="file" accept="application/json,.json" hidden>
      </div>
      <div class="backup-status" id="finance-status" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script>
    (() => {
      const YEAR = 2026, MONTH = 10, TODAY = new Date(2026, 10, 16);
      const values = {
        "2026-10-26":12,"2026-10-27":-18,"2026-10-28":25,"2026-10-29":9,"2026-10-30":34,"2026-10-31":-11,
        "2026-11-01":20,"2026-11-02":17,"2026-11-03":8,"2026-11-04":-14,"2026-11-05":22,"2026-11-06":11,
        "2026-11-07":36,"2026-11-08":-9,"2026-11-09":27,"2026-11-10":5,"2026-11-11":48,"2026-11-12":-27,
        "2026-11-13":30,"2026-11-14":-95,"2026-11-15":10,"2026-11-16":-42,"2026-11-17":78,"2026-11-18":-20,
        "2026-11-19":63,"2026-11-20":15,"2026-11-21":-8,"2026-11-22":19,"2026-11-23":24,"2026-11-24":-17,
        "2026-11-25":21,"2026-11-26":33,"2026-11-27":-12,"2026-11-28":40,"2026-11-29":18,"2026-11-30":29,
        "2026-12-01":14,"2026-12-02":-6,"2026-12-03":27,"2026-12-04":-19,"2026-12-05":23,"2026-12-06":8
      };
      // Restore user edits before the calendar is first rendered.
      const valuesStorageKey = "sendbox-calendar-values-v1";
      try {
        const savedValues = JSON.parse(localStorage.getItem(valuesStorageKey) || "null");
        if (savedValues && typeof savedValues === "object" && !Array.isArray(savedValues)) {
          Object.entries(savedValues).forEach(([date, value]) => {
            if (date.length === 10 && date[4] === "-" && date[7] === "-" && Number.isFinite(Number(value))) values[date] = Number(value);
          });
        }
      } catch (error) {
        console.warn("Could not restore calendar values", error);
      }

      const financeBaseKey = "sendbox-deposit-base-v1";
      const financeHistoryKey = "sendbox-deposit-history-v1";
      let financeBase = 500;
      let financeHistory = [];
      try {
        const storedBase = localStorage.getItem(financeBaseKey);
        if (storedBase !== null && Number.isFinite(Number(storedBase)) && Number(storedBase) >= 0) financeBase = Number(storedBase);
        const storedHistory = JSON.parse(localStorage.getItem(financeHistoryKey) || "[]");
        if (Array.isArray(storedHistory)) financeHistory = storedHistory.filter(item => item && (item.type === "deposit" || item.type === "withdrawal") && typeof item.date === "string" && Number.isFinite(Number(item.amount)) && Number(item.amount) > 0);
      } catch (error) { console.warn("Could not restore deposit data", error); }

      const pad = n => String(n).padStart(2, "0");
      const key = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
      const amount = n => (n < 0 ? "-$" + Math.abs(n) : "$" + n);
      const tone = n => n < 0 ? "negative" : "positive";
      const isFuture = d => d > TODAY;
      const compact = document.getElementById("compactDays");
      const grid = document.getElementById("calendarGrid");
      const card = document.getElementById("performanceCard");
      const toggle = document.getElementById("calendarToggle");
      const panel = document.getElementById("calendarPanel");

      for (let day = 11; day <= 20; day++) {
        const d = new Date(YEAR, MONTH, day), v = values[key(d)];
        const item = document.createElement("div");
        item.className = "day-mini" + (day === 16 ? " today" : "") + (isFuture(d) ? " future" : "");
        item.dataset.date = key(d);
        item.innerHTML = '<span class="date">'+day+' Nov</span><span class="value '+tone(v)+'">'+amount(v)+'</span>';
        compact.appendChild(item);
      }

      const first = new Date(YEAR, MONTH, 1);
      const mondayOffset = (first.getDay() + 6) % 7;
      // Keep weekday alignment, but render dates from this month only.
      for (let i = 0; i < mondayOffset; i++) {
        const spacer = document.createElement("div");
        spacer.setAttribute("aria-hidden", "true");
        grid.appendChild(spacer);
      }
      const daysInMonth = new Date(YEAR, MONTH + 1, 0).getDate();
      for (let day = 1; day <= daysInMonth; day++) {
        const d = new Date(YEAR, MONTH, day);
        const v = values[key(d)] ?? 0;
        const cell = document.createElement("div");
        cell.className = "day-cell" + (isFuture(d) ? " future" : "") + (key(d) === key(TODAY) ? " today" : "");
        cell.dataset.date = key(d);
        cell.setAttribute("aria-label", d.toLocaleDateString("en-US", {month:"long", day:"numeric", year:"numeric"}) + ", " + amount(v));
        cell.innerHTML = '<span class="num">'+d.getDate()+'</span><span class="value '+tone(v)+'">'+amount(v)+'</span>';
        grid.appendChild(cell);
      }

      function setExpanded(expanded) {
        card.setAttribute("aria-expanded", String(expanded));
        toggle.setAttribute("aria-expanded", String(expanded));
        toggle.setAttribute("aria-label", expanded ? "Close full November calendar" : "Open full November calendar");
        panel.inert = !expanded;
      }
      let rangeStart = null;
      let rangeEnd = null;
      let holdTimer = null;
      let holdPointerId = null;
      let holdStarted = false;
      let suppressClickUntil = 0;
      let pointerStartX = 0;
      let pointerStartY = 0;
      let editMode = false;
      let selectingRangeEnd = false;

      function setEditMode(enabled) {
        editMode = enabled;
        card.classList.toggle("edit-mode", enabled);
        if (enabled) setExpanded(true);
      }

      function paintRange() {
        const low = rangeStart && rangeEnd ? (rangeStart < rangeEnd ? rangeStart : rangeEnd) : rangeStart;
        const high = rangeStart && rangeEnd ? (rangeStart < rangeEnd ? rangeEnd : rangeStart) : null;
        const status = document.getElementById("rangeStatus");
        if (status) {
          if (!rangeStart) status.textContent = "";
          else if (selectingRangeEnd) status.textContent = "Start: " + rangeStart + " — tap the end date";
          else status.textContent = "Selected: " + (rangeStart < rangeEnd ? rangeStart : rangeEnd) + " → " + (rangeStart < rangeEnd ? rangeEnd : rangeStart) + " — hold a date in the range to edit its amount";
        }
        grid.querySelectorAll(".day-cell").forEach(cell => {
          const date = cell.dataset.date;
          cell.classList.remove("range-start", "range-end", "in-range");
          if (!rangeStart) return;
          if (date === low) cell.classList.add("range-start");
          if (high && date === high && !selectingRangeEnd) cell.classList.add("range-end");
          if (high && date > low && date < high) cell.classList.add("in-range");
        });
      }

      function selectDate(date) {
        if (!editMode || !rangeStart) return;
        // Match Romano Dashboard: the first tap chooses the end date.
        // If the user taps before the start, that date becomes the new start.
        if (!selectingRangeEnd) {
          rangeStart = date;
          rangeEnd = date;
          selectingRangeEnd = true;
          editorAmount.value = "";
          editorRangeLabel.textContent = date + " — выбери конец";
          paintRange();
          return;
        }
        if (date.slice(0, 7) !== rangeStart.slice(0, 7)) return;
        if (date < rangeStart) {
          rangeStart = date;
          rangeEnd = date;
          editorAmount.value = "";
          editorRangeLabel.textContent = date + " — выбери конец";
          paintRange();
          return;
        }
        if (date === rangeStart) return;
        rangeEnd = date;
        selectingRangeEnd = false;
        updateEditorRange();
        paintRange();
      }

      function clearDateRange() {
        rangeStart = null;
        rangeEnd = null;
        selectingRangeEnd = false;
        paintRange();
      }

      const editor = document.getElementById("calendarEditor");
      const editorAmount = document.getElementById("editorAmount");
      const editorRangeLabel = document.getElementById("editorRangeLabel");
      function dateKeysBetween(first,last) {
        const lo = first < last ? first : last, hi = first < last ? last : first, out = [];
        const d = new Date(lo + "T12:00:00"), finish = new Date(hi + "T12:00:00");
        while (d <= finish) { out.push(key(d)); d.setDate(d.getDate()+1); }
        return out;
      }
      function openCalendarEditor(date) {
        setEditMode(true); setExpanded(true);
        rangeStart = date; rangeEnd = date; selectingRangeEnd = true;
        editor.hidden = false; editorAmount.value = String(values[date] ?? 0);
        editorRangeLabel.textContent = date; paintRange();
      }
      function updateEditorRange() {
        if (!rangeStart || !rangeEnd) return;
        const dates = dateKeysBetween(rangeStart,rangeEnd), first = values[dates[0]] ?? 0;
        editorAmount.value = dates.every(d => (values[d] ?? 0) === first) ? String(first) : "";
        editorRangeLabel.textContent = dates[0] + " — " + dates[dates.length-1];
      }
      function closeCalendarEditor() {
        editor.hidden = true; setEditMode(false); clearDateRange();
      }
      function editDateAmount(date) {
        if (!rangeStart || !rangeEnd) return;
        editor.hidden = false; updateEditorRange(); editorAmount.focus();
      }
      function saveCalendarEdit() {
        const raw = editorAmount.value.trim(), number = Number(raw);
        // A long-press opens the editor for one day. If no end date was
        // selected, save that single day instead of silently doing nothing.
        if (!rangeStart || !raw || !Number.isFinite(number)) { editorAmount.focus(); return; }
        const endDate = selectingRangeEnd || !rangeEnd ? rangeStart : rangeEnd;
        const days = dateKeysBetween(rangeStart, endDate);
        const previous = {};
        days.forEach(day => { previous[day] = values[day]; values[day] = Math.round(number * 100) / 100; });
        try {
          localStorage.setItem(valuesStorageKey, JSON.stringify(values));
        } catch (error) {
          days.forEach(day => {
            if (previous[day] === undefined) delete values[day];
            else values[day] = previous[day];
          });
          console.error("Could not save calendar values", error);
          const status = document.getElementById("rangeStatus");
          if (status) status.textContent = "Не удалось сохранить изменения в этом браузере";
          return;
        }
        days.forEach(day => {
          document.querySelectorAll('[data-date="' + day + '"] .value').forEach(el => {
            el.textContent = amount(values[day]);
            el.className = "value " + tone(values[day]);
          });
        });
        closeCalendarEditor();
      }

      grid.addEventListener("contextmenu", event => event.preventDefault());
      grid.addEventListener("selectstart", event => event.preventDefault());
      compact.addEventListener("contextmenu", event => event.preventDefault());
      compact.addEventListener("selectstart", event => event.preventDefault());

      // Long press: use native touch events on phones and pointer events for mouse.
      function resolveLongPressTarget(target, source) {
        if (source !== "grid" || editMode) return null;
        const el = target instanceof Element ? target : target && target.parentElement;
        const cell = el && el.closest(".day-cell[data-date]");
        return cell ? { cell, date: cell.dataset.date, kind: "date" } : null;
      }

      function beginHold(target, source, x, y, pointerId) {
        const info = resolveLongPressTarget(target, source);
        if (!info) return;
        if (holdTimer !== null) window.clearTimeout(holdTimer);
        holdPointerId = pointerId;
        holdStarted = false;
        suppressClickUntil = 0;
        pointerStartX = x;
        pointerStartY = y;
        holdTimer = window.setTimeout(() => {
          holdStarted = true;
          suppressClickUntil = Date.now() + 900;
          info.cell.classList.add("long-pressing");
          if (info.kind === "date") openCalendarEditor(info.date);
          else editDateAmount(info.date);
          window.setTimeout(() => info.cell.classList.remove("long-pressing"), 250);
        }, 480);
      }

      function cancelHold(pointerId) {
        if (holdPointerId !== pointerId) return;
        if (holdTimer !== null) window.clearTimeout(holdTimer);
        holdTimer = null;
        holdPointerId = null;
      }

      // Touch events are used explicitly because some mobile browsers interrupt
      // pointer-based long presses while handling scrolling/callout gestures.
      function attachLongPress(element, source) {
        element.addEventListener("touchstart", event => {
          if (event.touches.length !== 1) return;
          const touch = event.touches[0];
          beginHold(event.target, source, touch.clientX, touch.clientY, "touch");
        }, {passive:true});
        element.addEventListener("touchmove", event => {
          if (holdPointerId !== "touch" || holdStarted || !event.touches.length) return;
          const touch = event.touches[0];
          if (Math.hypot(touch.clientX - pointerStartX, touch.clientY - pointerStartY) > 30) cancelHold("touch");
        }, {passive:true});
        element.addEventListener("touchend", () => cancelHold("touch"), {passive:true});
        element.addEventListener("touchcancel", () => cancelHold("touch"), {passive:true});
        element.addEventListener("pointerdown", event => {
          if (event.pointerType === "touch" || event.button !== 0) return;
          beginHold(event.target, source, event.clientX, event.clientY, event.pointerId);
        });
      }
      attachLongPress(grid, "grid");

      window.addEventListener("pointerup", event => cancelHold(event.pointerId), true);
      window.addEventListener("pointercancel", event => cancelHold(event.pointerId), true);
      window.addEventListener("pointermove", event => {
        if (holdPointerId !== event.pointerId || holdStarted) return;
        if (Math.hypot(event.clientX - pointerStartX, event.clientY - pointerStartY) > 30) cancelHold(event.pointerId);
      }, true);

      grid.addEventListener("click", event => {
        const cell = event.target.closest(".day-cell[data-date]");
        if (!cell || !isExpanded()) return;
        if (Date.now() < suppressClickUntil) {
          suppressClickUntil = 0;
          event.preventDefault();
          event.stopPropagation();
          return;
        }
        if (editMode) selectDate(cell.dataset.date);
      });

      document.getElementById("editorCancel").addEventListener("click", closeCalendarEditor);
      document.getElementById("editorSave").addEventListener("click", saveCalendarEdit);
      editorAmount.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          saveCalendarEdit();
        }
      });
      const isExpanded = () => card.getAttribute("aria-expanded") === "true";
      const toggleCalendar = () => setExpanded(!isExpanded());

      // Dates in the compact strip open the full calendar.
      compact.addEventListener("click", event => {
        if (event.target.closest(".day-mini") && !isExpanded()) setExpanded(true);
      });

      // Tapping the month title opens when collapsed and closes when expanded.
      const monthTitle = document.getElementById("monthToggle");
      monthTitle.addEventListener("click", event => {
        event.stopPropagation();
        setExpanded(!isExpanded());
      });

      // While expanded, the top header and progress strip are close controls.
      document.querySelector(".topline").addEventListener("click", () => {
        if (isExpanded()) setExpanded(false);
      });
      document.querySelector(".progress").addEventListener("click", () => {
        if (isExpanded()) setExpanded(false);
      });

      // The expanded calendar stays open when tapped; tapping outside the card closes it.
      document.addEventListener("click", event => {
        if (!grid.contains(event.target) && !editor.contains(event.target)) clearDateRange();
        if (isExpanded() && !card.contains(event.target)) setExpanded(false);
      });

      const financeBalance = document.getElementById("finance-balance");
      const financeBaseLabel = document.getElementById("finance-base");
      const financeCalendarTotal = document.getElementById("finance-calendar-total");
      const financeDeposits = document.getElementById("finance-deposits");
      const financeWithdrawals = document.getElementById("finance-withdrawals");
      const financeHistoryList = document.getElementById("finance-history");
      const financeAmount = document.getElementById("finance-amount");
      const financeDate = document.getElementById("finance-date");
      const financeStatus = document.getElementById("finance-status");
      const financeMoney = value => "$" + Number(value).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
      financeDate.value = key(TODAY);
      function getCalendarContribution() {
        return Math.round(Object.entries(values).reduce((sum,[date,value]) => date <= key(TODAY) && Number.isFinite(Number(value)) ? sum + Number(value) : sum,0)*100)/100;
      }
      function getFinanceTransactionTotal() {
        return financeHistory.filter(item => item.date <= key(TODAY)).reduce((sum,item) => sum + (item.type === "deposit" ? Number(item.amount) : -Number(item.amount)),0);
      }
      function getFinanceBalance() {
        return Math.round((financeBase + getCalendarContribution() + getFinanceTransactionTotal())*100)/100;
      }
      function saveFinanceData() {
        localStorage.setItem(financeBaseKey,String(financeBase));
        localStorage.setItem(financeHistoryKey,JSON.stringify(financeHistory));
      }
      function renderFinance() {
        const calendarTotal = getCalendarContribution();
        const balance = getFinanceBalance();
        financeBalance.textContent = financeMoney(balance);
        financeBaseLabel.textContent = financeMoney(financeBase);
        financeCalendarTotal.textContent = (calendarTotal < 0 ? "−" : "+") + financeMoney(Math.abs(calendarTotal));
        document.getElementById("calendar-total").textContent = financeMoney(balance);
        financeDeposits.textContent = financeMoney(financeHistory.filter(x=>x.type==="deposit").reduce((s,x)=>s+Number(x.amount),0));
        financeWithdrawals.textContent = "−" + financeMoney(financeHistory.filter(x=>x.type==="withdrawal").reduce((s,x)=>s+Number(x.amount),0));
        financeHistoryList.innerHTML = "";
        financeHistory.slice().sort((a,b)=>b.date.localeCompare(a.date)||(Number(b.createdAt)||0)-(Number(a.createdAt)||0)).forEach(item=>{
          const row=document.createElement("div");
          row.className="finance-history-row"+(item.type==="withdrawal"?" withdraw":"");
          const icon=document.createElement("span");icon.className="finance-history-icon";icon.textContent=item.type==="deposit"?"+":"−";
          const details=document.createElement("div");
          const date=document.createElement("time");date.className="finance-history-date";date.dateTime=item.date;
          date.textContent=new Date(item.date+"T12:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});
          const type=document.createElement("span");type.className="finance-history-type";type.textContent=item.type==="deposit"?"Пополнение":"Вывод";
          details.append(date,type);
          const amount=document.createElement("strong");amount.className="finance-history-amount";
          amount.textContent=(item.type==="deposit"?"+":"−")+financeMoney(item.amount);
          row.append(icon,details,amount);financeHistoryList.appendChild(row);
        });
        if(!financeHistory.length){const empty=document.createElement("div");empty.className="finance-empty";empty.textContent="Операций пока нет";financeHistoryList.appendChild(empty);}
      }
      function addFinanceTransaction(type) {
        const amount=Number(financeAmount.value), date=financeDate.value;
        if(!Number.isFinite(amount)||amount<=0||!date){financeStatus.textContent="Укажи корректную сумму и дату операции.";return;}
        if(type==="withdrawal" && date<=key(TODAY) && amount>getFinanceBalance()){financeStatus.textContent="Нельзя вывести больше текущего депозита.";return;}
        financeHistory.push({id:"sendbox-"+Date.now()+"-"+Math.random().toString(36).slice(2,8),date,type,amount:Math.round(amount*100)/100,createdAt:Date.now()});
        try{saveFinanceData();}catch(error){financeHistory.pop();financeStatus.textContent="Не удалось сохранить операцию в браузере.";return;}
        financeAmount.value="";financeStatus.textContent=type==="deposit"?"Пополнение добавлено.":"Вывод добавлен.";renderFinance();
      }
      document.getElementById("finance-deposit").addEventListener("click",()=>addFinanceTransaction("deposit"));
      document.getElementById("finance-withdraw").addEventListener("click",()=>addFinanceTransaction("withdrawal"));
      document.getElementById("finance-export").addEventListener("click",()=>{
        const backup={format:"sendbox-calendar-backup",version:1,createdAt:new Date().toISOString(),values,financeBase,financeHistory};
        const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
        const url=URL.createObjectURL(blob);const link=document.createElement("a");
        link.href=url;link.download="sendbox-backup-"+key(TODAY)+".json";document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);
        financeStatus.textContent="Резервная копия экспортирована.";
      });
      const financeFile=document.getElementById("finance-file");
      document.getElementById("finance-import").addEventListener("click",()=>financeFile.click());
      financeFile.addEventListener("change",()=>{
        const file=financeFile.files&&financeFile.files[0];if(!file)return;
        const reader=new FileReader();
        reader.onload=()=>{
          try{
            const backup=JSON.parse(String(reader.result||""));
            if(!backup||backup.format!=="sendbox-calendar-backup"||backup.version!==1||!backup.values||typeof backup.values!=="object"||Array.isArray(backup.values)||!Number.isFinite(Number(backup.financeBase))||Number(backup.financeBase)<0||!Array.isArray(backup.financeHistory))throw new Error("Файл не является резервной копией Sendbox.");
            const validValues={};
            Object.entries(backup.values).forEach(([date,value])=>{if(/^\d{4}-\d{2}-\d{2}$/.test(date)&&Number.isFinite(Number(value)))validValues[date]=Number(value);});
            const validHistory=backup.financeHistory.filter(item=>item&&(item.type==="deposit"||item.type==="withdrawal")&&/^\d{4}-\d{2}-\d{2}$/.test(item.date)&&Number.isFinite(Number(item.amount))&&Number(item.amount)>0);
            if(!window.confirm("Заменить календарь, депозит и историю данными из резервной копии?"))return;
            Object.keys(values).forEach(date=>delete values[date]);Object.assign(values,validValues);
            financeBase=Number(backup.financeBase);financeHistory=validHistory;
            localStorage.setItem(valuesStorageKey,JSON.stringify(values));saveFinanceData();
            renderFinance();
            document.querySelectorAll(".day-cell[data-date]").forEach(cell=>{const v=values[cell.dataset.date]??0;const label=cell.querySelector(".value");if(label){label.textContent=amount(v);label.className="value "+tone(v);}});
            document.querySelectorAll(".day-mini[data-date]").forEach(cell=>{const v=values[cell.dataset.date]??0;const label=cell.querySelector(".value");if(label){label.textContent=amount(v);label.className="value "+tone(v);}});
            financeStatus.textContent="Данные успешно импортированы.";
          }catch(error){financeStatus.textContent=error.message||"Не удалось импортировать файл.";}
          finally{financeFile.value="";}
        };
        reader.onerror=()=>{financeStatus.textContent="Не удалось прочитать файл.";financeFile.value="";};
        reader.readAsText(file);
      });
      renderFinance();

      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && card.getAttribute("aria-expanded") === "true") {
          setExpanded(false); toggle.focus();
        }
      });
    })();
  </script>
</body>
</html>
